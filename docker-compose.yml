services:
  postgres:
    image: postgres:17
    container_name: bp_benchmark_postgres
    restart: unless-stopped
    # Interpolado desde el .env de la raiz (Docker Compose lo autocarga) -- misma
    # fuente de verdad que src/benchmark_bancos/config/, en vez de credenciales hardcodeadas que
    # podian divergir en silencio de .env/.env.example.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bp_benchmark_pgdata:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d corre los scripts en orden lexicografico de nombre de
      # archivo, asi que montar el directorio completo cubre todas las migraciones
      # existentes de una vez y no requiere editar este archivo cada vez que se agregue
      # una migracion nueva (sql/22, sql/23, ...).
      #
      # sql/00_roles_db.sql SI se incluye deliberadamente: toma rol/base/password de
      # POSTGRES_USER/POSTGRES_DB/POSTGRES_PASSWORD (\getenv; la imagen trae psql 17) y
      # los crea solo si no existen. El propio contenedor ya crea ese rol y esa base a
      # partir de las env vars de arriba antes de correr los scripts de init, asi que
      # sql/00 queda como no-op idempotente. POSTGRES_USER puede tener cualquier nombre
      # (desde 2026-10-09 ninguna migracion fija 'bp_etl'): sql/01..NN corren como ese
      # rol y los esquemas meta/staging/marts quedan a su nombre.
      #
      # Estos scripts no se anotan en meta.schema_migrations: el primer
      # `benchmark-bancos migrate` desde el host verifica con sus sondas que la base esta
      # al dia y la registra solo (baseline automatico). Las migraciones posteriores se
      # aplican con `migrate`, no con este montaje (solo corre con el volumen vacio).
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bp_benchmark_pgdata:
