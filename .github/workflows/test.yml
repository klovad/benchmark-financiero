name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-unit:
    # pytest -m "not integration": matching/normalización de identidad, parsers con
    # fixtures locales, sha256_file() y el parseo de fecha-desde-nombre-de-archivo.
    # Sin DB, sin red. Ver docs/propuesta_escalabilidad_etl.md sección 2.4.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias (uv.lock)
        run: uv sync --locked

      - name: pytest (unit)
        run: uv run pytest -m "not integration" -v

  test-integration:
    # postgres:17 como service container. GitHub Actions no soporta el mount de
    # docker-entrypoint-initdb.d que usa docker-compose.yml en local, así que el
    # schema se aplica explícitamente vía psql, sql/*.sql en orden lexicográfico de
    # nombre de archivo -- mismo orden en el que correrían como initdb scripts.
    #
    # POSTGRES_USER=etl_ci (a propósito distinto del default bp_etl, 2026-10-09): verifica
    # que nada dependa del nombre del rol. El contenedor crea el rol y la base a partir
    # de estas env vars antes de cualquier paso; sql/00 los lee con \getenv y queda como
    # no-op idempotente. Después de aplicar sql/ con psql (registro de migraciones vacío),
    # `benchmark-bancos migrate` debe hacer el baseline automático y dejar 0 pendientes.
    # POSTGRES_PASSWORD es descartable, solo para este job.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: etl_ci
          POSTGRES_DB: benchmark_cartera_depositos
          POSTGRES_PASSWORD: ci_throwaway_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl_ci -d benchmark_cartera_depositos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: benchmark_cartera_depositos
      POSTGRES_USER: etl_ci
      POSTGRES_PASSWORD: ci_throwaway_password
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias (uv.lock)
        run: uv sync --locked

      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Aplicar migraciones (sql/*.sql en orden lexicográfico)
        run: |
          set -e
          for f in sql/*.sql; do
            echo "Aplicando $f"
            PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: migrate (baseline automático sobre la base armada con psql)
        run: |
          set -e
          uv run benchmark-bancos migrate
          uv run benchmark-bancos migrate --status 2>&1 | tee estado.txt
          grep -q "0 pendientes" estado.txt

      - name: pytest (integration)
        run: uv run pytest -m integration -v
