name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Puro lint estatico: sin DB, sin red (aparte de instalar las herramientas). Ver
    # docs/propuesta_escalabilidad_etl.md seccion 2.4.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Versiones de ruff/black fijadas en el grupo `dev` de pyproject.toml (uv.lock):
      # local y CI usan exactamente las mismas.
      - name: Instalar herramientas de desarrollo (uv.lock)
        run: uv sync --locked --only-dev

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: black --check
        run: uv run --no-sync black --check .
